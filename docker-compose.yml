services:
  # --- Database Service ---
  db:
    image: postgres:alpine3.22
    container_name: postgres
    # These variables are pulled from your local .env file
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend Service ---
  fastapi-service:
    build: ./model_service
    container_name: fastapi
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  # --- Streamlit Frontend Service ---
  streamlit-service:
    build: ./webapp
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./webapp:/app
    env_file:
      - .env
    environment:
      # Internal URL for Streamlit to talk to FastAPI
      - REP_PREDICT_API_URL=http://fastapi-service:80
    depends_on:
      - fastapi-service
      - db

