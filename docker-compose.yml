
x-airflow-common:
  &airflow-common
  image: apache/airflow:3.1.7
  env_file:
    - .env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID}:0"

services:
  db:
    image: postgres:alpine3.22
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      

  fastapi-service:
    build: ./model_service
    image: tiagolow/fastapi
    container_name: fastapi
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db
      

  streamlit-service:
    build: ./webapp
    image: streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./webapp:/app
    env_file:
      - .env
    environment:
      - REP_PREDICT_API_URL=http://fastapi-service:80
    depends_on:
      - fastapi-service
      - db


  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: >
      bash -c "airflow api-server >> /opt/airflow/logs/airflow_api-server.log 2>&1"    
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/api/v2/version"]      
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - airflow-init


  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: >
      bash -c "airflow scheduler >> /opt/airflow/logs/airflow_scheduler.log 2>&1"    
    ports:
      - "8974:8080"
    restart: always
    depends_on:
      - airflow-init


  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: >
      bash -c "airflow dag-processor >> /opt/airflow/logs/airflow_dag-processor.log 2>&1"    
    restart: always
    depends_on:
       - airflow-init       
        

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags}
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags}

    environment:      
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:      
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      - db

volumes:
  postgres-db-volume: